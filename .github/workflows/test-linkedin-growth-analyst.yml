name: Test LinkedIn Growth Analyst

on:
  pull_request:
    paths:
      - 'skills/8signal-linkedin-growth-analyst/**'
      - '.github/workflows/test-linkedin-growth-analyst.yml'
  push:
    branches: [main]
    paths:
      - 'skills/8signal-linkedin-growth-analyst/**'
      - '.github/workflows/test-linkedin-growth-analyst.yml'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run analyzer tests
        run: python -m unittest discover -s skills/8signal-linkedin-growth-analyst/scripts -v
      - name: Run the documented PowerShell command from a plugin-style install
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Same command as the PowerShell example in SKILL.md, run from outside the repository.
          $skill = "$env:USERPROFILE\.claude\plugins\cache\marketingskills\marketing-skills\2.10.0\skills\8signal-linkedin-growth-analyst"
          New-Item -ItemType Directory -Force $skill | Out-Null
          Copy-Item -Recurse -Force "skills\8signal-linkedin-growth-analyst\*" $skill
          New-Item -ItemType Directory -Force "$env:USERPROFILE\Downloads" | Out-Null
          Set-Content -Encoding UTF8 -Path "$env:USERPROFILE\Downloads\linkedin-posts.csv" -Value "url,reactions,comments,reposts", "https://www.linkedin.com/posts/example-activity-1,3,1,"
          Set-Location $env:RUNNER_TEMP
          if (Get-Command py -ErrorAction SilentlyContinue) {
            Write-Output "launcher: py -3"
            py -3 "$skill\scripts\analyze_posts.py" --input "$env:USERPROFILE\Downloads\linkedin-posts.csv" --output "$env:USERPROFILE\Downloads\linkedin-audit.json"
          } else {
            Write-Output "launcher: python"
            python "$skill\scripts\analyze_posts.py" --input "$env:USERPROFILE\Downloads\linkedin-posts.csv" --output "$env:USERPROFILE\Downloads\linkedin-audit.json"
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $result = Get-Content -Raw "$env:USERPROFILE\Downloads\linkedin-audit.json" | ConvertFrom-Json
          if ($result.posts_observed -ne 1 -or $result.metric_medians.reactions.median -ne 3) { exit 1 }
          Write-Output "documented command OK"
